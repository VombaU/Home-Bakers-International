services:
  frontend:
    build:
      context: ./Frontend
    ports:
      - "7088:7088"
    depends_on:
      - backend

  backend:
    build:
      context: ./server
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/HomeBakers_International
    depends_on:
      - db

  db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: HomeBakers_International
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: